name: Expand Stellar Mosaic Tarot descriptions

on:
  push:
    branches:
      - feat/stellar-mosaic-tarot-card-descriptions
    paths:
      - .deck-build/READY
      - .deck-build/TRIGGER
      - .deck-build/recover.py
      - .deck-build/candidates/**
      - .github/workflows/expand-stellar-mosaic.yml
  pull_request:
    branches:
      - feat/stellar-mosaic-tarot-card-descriptions
    paths:
      - .deck-build/READY
      - .deck-build/TRIGGER
      - .deck-build/recover.py
      - .deck-build/candidates/**
      - .github/workflows/expand-stellar-mosaic.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/stellar-mosaic-tarot-card-descriptions

      - name: Recover, extract, and validate all descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 .deck-build/recover.py

      - name: Remove the one-shot recovery transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deck-build
          rm -f .github/workflows/expand-stellar-mosaic.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit the completed deck documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add complete Stellar Mosaic Tarot card descriptions'
          git push origin HEAD:feat/stellar-mosaic-tarot-card-descriptions
