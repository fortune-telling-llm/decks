name: Expand Stellar Mosaic Tarot descriptions

on:
  push:
    branches:
      - feat/stellar-mosaic-tarot-card-descriptions
    paths:
      - .deck-build/READY
      - .deck-build/TRIGGER
      - .deck-build/candidates/**
      - .github/workflows/expand-stellar-mosaic.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Reconstruct and verify the preserved archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import hashlib
          import lzma
          import sys
          from pathlib import Path

          TARGET_SHA256 = 'c5dd8815d7c2f80d4d142c3bff6dff251ca225f60800506076bdc71b51f01676'
          XZ_MAGIC = b'\xfd7zXZ\x00'
          MAX_NODES = 250_000

          paths = sorted(Path('.deck-build').glob('payload.part-*'))
          paths += sorted(Path('.deck-build/candidates').glob('*'))
          if not paths:
              raise SystemExit('No preserved payload chunks were found.')

          chunks: dict[str, bytes] = {}
          for path in paths:
              data = b''.join(path.read_bytes().split())
              if not data:
                  raise SystemExit(f'Empty payload chunk: {path}')
              chunks[path.as_posix()] = data

          print('Preserved chunks:')
          for name, data in chunks.items():
              print(f'  {name}: {len(data)} bytes; prefix={data[:16]!r}; suffix={data[-16:]!r}')

          starts = [name for name, data in chunks.items() if data.startswith(b'/Td6WFoAA')]
          if len(starts) != 1:
              raise SystemExit(f'Expected one XZ/base64 opening chunk, found {starts!r}.')
          start = starts[0]
          remaining = tuple(name for name in chunks if name != start)
          visited = 0

          def encoded_for(order: tuple[str, ...]) -> bytes:
              return b''.join(chunks[name] for name in order)

          def inspect(order: tuple[str, ...]) -> tuple[str, bytes | None]:
              encoded = encoded_for(order)
              usable = len(encoded) - (len(encoded) % 4)
              if usable < 12:
                  return 'prefix', None
              try:
                  decoded_prefix = base64.b64decode(encoded[:usable], validate=True)
              except (binascii.Error, ValueError):
                  return 'invalid', None
              if not decoded_prefix.startswith(XZ_MAGIC):
                  return 'invalid', None

              decompressor = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              try:
                  decompressor.decompress(decoded_prefix)
              except (lzma.LZMAError, EOFError):
                  return 'invalid', None

              if not decompressor.eof:
                  return 'prefix', None

              try:
                  full = base64.b64decode(encoded, validate=True)
              except (binascii.Error, ValueError):
                  return 'invalid', None
              if hashlib.sha256(full).hexdigest() != TARGET_SHA256:
                  return 'invalid', None
              try:
                  lzma.decompress(full, format=lzma.FORMAT_XZ)
              except lzma.LZMAError:
                  return 'invalid', None
              return 'match', full

          def search(order: tuple[str, ...], unused: tuple[str, ...]) -> tuple[tuple[str, ...], bytes] | None:
              nonlocal_visited[0] += 1
              count = nonlocal_visited[0]
              if count > MAX_NODES:
                  raise RuntimeError(f'Reconstruction exceeded {MAX_NODES} search nodes.')
              if count % 5000 == 0:
                  print(f'Checked {count} candidate prefixes...', flush=True)

              status, archive = inspect(order)
              if status == 'match':
                  assert archive is not None
                  return order, archive
              if status == 'invalid':
                  return None

              choices = sorted(unused, key=lambda name: (len(chunks[name]) < 100, name))
              for name in choices:
                  next_unused = tuple(item for item in unused if item != name)
                  result = search(order + (name,), next_unused)
                  if result is not None:
                      return result
              return None

          nonlocal_visited = [visited]
          result = search((start,), remaining)
          if result is None:
              raise SystemExit(
                  f'No ordered subset of the {len(chunks)} preserved chunks matched {TARGET_SHA256}.'
              )

          order, archive = result
          output = Path('/tmp/stellar-mosaic.tar.xz')
          output.write_bytes(archive)
          actual = hashlib.sha256(archive).hexdigest()
          print(f'Reconstructed archive after {nonlocal_visited[0]} prefix checks.')
          print(f'Archive size: {len(archive)} bytes')
          print(f'Archive SHA-256: {actual}')
          print('Selected chunk order:')
          for index, name in enumerate(order):
              print(f'  {index:02d}: {name}')
          assert actual == TARGET_SHA256
          PY

          xz --test /tmp/stellar-mosaic.tar.xz
          tar -tJf /tmp/stellar-mosaic.tar.xz | sed -n '1,12p'

      - name: Expand and validate every card description
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --xz --file /tmp/stellar-mosaic.tar.xz --no-same-owner

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('tarot/stellar-mosaic-tarot')
          files = sorted(
              root.glob('[0-9]*.md'),
              key=lambda path: int(path.name.split('-', 1)[0]),
          )
          assert len(files) == 78, f'expected 78 card files, found {len(files)}'
          indices = [int(path.name.split('-', 1)[0]) for path in files]
          assert indices == list(range(1, 79)), f'non-continuous card indices: {indices}'
          assert (root / '1-ace-of-wands.md').is_file()
          assert (root / '78-the-world.md').is_file()
          assert (root / 'DECK-INFO.md').is_file()

          required = (
              '## Card metadata',
              '## Literal visual description',
              '## Core meaning',
              '### Upright keywords',
              '### Reversed / shadow keywords',
              '## Symbol-by-symbol interpretation',
              '## Divinatory interpretation by question type',
              '## Intentions',
              '## Feelings',
              '## Actions / likely next move',
              '## Advice',
              '## Outcome',
              '## Yes / no',
              '## Timing',
              '## Health / wellbeing readings',
              '## Spread interactions',
              '## Image-led reading examples',
              '## Fortune-teller cautions',
              '## One-sentence essence',
          )
          forbidden = re.compile(
              r'placeholder|lorem ipsum|(^|[^A-Z])TBD([^A-Z]|$)|(^|[^A-Z])TODO([^A-Z]|$)',
              re.I,
          )
          titles: list[str] = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              first = text.splitlines()[0]
              assert first.startswith('# '), f'{path}: missing title'
              titles.append(first)
              for heading in required:
                  assert heading in text, f'{path}: missing {heading}'
              assert not forbidden.search(text), f'{path}: placeholder marker found'
              symbol_sections = len(re.findall(r'^### .+ — .+$', text, re.M))
              assert symbol_sections >= 5, f'{path}: fewer than five card-specific symbol sections'

          assert len(set(titles)) == 78, 'duplicate card titles found'
          assert sum(1 for path in files if '-of-wands.md' in path.name) == 14
          assert sum(1 for path in files if '-of-cups.md' in path.name) == 14
          assert sum(1 for path in files if '-of-swords.md' in path.name) == 14
          assert sum(1 for path in files if '-of-pentacles.md' in path.name) == 14
          assert len(files) - 56 == 22
          print('Validated 78 continuous, unique, fully structured card files.')
          PY

      - name: Remove the one-shot recovery transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deck-build
          rm -f .github/workflows/expand-stellar-mosaic.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit the completed deck documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add complete Stellar Mosaic Tarot card descriptions'
          git push origin HEAD:feat/stellar-mosaic-tarot-card-descriptions
