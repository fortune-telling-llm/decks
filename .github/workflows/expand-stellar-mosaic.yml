name: Inspect Stellar Mosaic recovery prefix

on:
  pull_request:
    branches:
      - feat/stellar-mosaic-tarot-card-descriptions
    paths:
      - .deck-build/TRIGGER
      - .deck-build/diagnose-prefix.py
      - .github/workflows/expand-stellar-mosaic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/stellar-mosaic-tarot-card-descriptions

      - name: Inspect complete tar members in the verified prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 .deck-build/diagnose-prefix.py
